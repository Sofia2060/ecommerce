<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Ảnh sản phẩm đang cập nhật">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faffde"/>
      <stop offset="1" stop-color="#ecfd87"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#113b00" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#dots)"/>
  <!-- túi sản phẩm cách điệu -->
  <g transform="translate(320 290)">
    <path d="M-110 -120 h220 l18 250 a24 24 0 0 1 -24 26 h-208 a24 24 0 0 1 -24 -26 z" fill="#fff" stroke="#113b00" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-110 -120 l14 -34 h192 l14 34" fill="#cadf47" stroke="#113b00" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-60 -154 v-10 M60 -154 v-10" stroke="#113b00" stroke-width="6" stroke-linecap="round"/>
    <!-- lá -->
    <path d="M0 40 C -46 22 -54 -36 -14 -66 C 34 -44 40 16 0 40 Z" fill="#4d8827"/>
    <path d="M0 40 C 2 0 -4 -30 -14 -66" fill="none" stroke="#113b00" stroke-width="4" stroke-linecap="round"/>
    <rect x="-70" y="72" width="140" height="12" rx="6" fill="#113b00" opacity=".15"/>
    <rect x="-48" y="96" width="96" height="10" rx="5" fill="#113b00" opacity=".1"/>
  </g>
  <text x="320" y="560" text-anchor="middle" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#113b00">Ảnh đang cập nhật</text>
</svg>
