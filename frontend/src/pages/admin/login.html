<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Quản trị NutriGreen</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#113b00">
  <link rel="icon" href="../../../public/images/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../public/fonts/fonts.css">
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/layout.css">
  <link rel="stylesheet" href="../../css/components/widgets.css">
  <link rel="stylesheet" href="../../css/admin/admin.css">
  <script src="../../js/core/common.js" defer></script>
  <script src="../../js/admin/admin.js" defer></script>
  <script src="../../js/admin/login.js" defer></script>
</head>
<body class="qt" data-page="admin" data-qt="login" data-khong-chat>
<main class="qt-login">
  <form class="card" data-qt-dn novalidate>
    <img src="../../../public/images/logo/nutrigreen-logo.webp" alt="NutriGreen" width="140" height="60">
    <h1 style="font-size:var(--ng-fs-xl);margin-top:14px">Đăng nhập quản trị</h1>
    <p class="small muted">Dành cho quản lý cửa hàng NutriGreen.</p>
    <div class="field"><label for="qt-email">Email</label><input class="input" id="qt-email" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="qt-mk">Mật khẩu</label><input class="input" id="qt-mk" name="mk" type="password" autocomplete="current-password" required></div>
    <p class="err small" data-loi style="color:var(--ng-red)"></p>
    <button class="btn btn--primary btn--block" type="submit">Đăng nhập</button>
    <p class="small mt-2 mb-0 text-center"><a href="../client/index.html">← Về cửa hàng</a></p>
  </form>
</main>
</body>
</html>
